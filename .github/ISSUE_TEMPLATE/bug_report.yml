name: Bug report
description: Something isn't behaving the way the docs or the policy engine say it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. If this is a **security vulnerability**
        (a way to bypass the policy engine, execute an unintended command, or otherwise
        defeat RedWrench's access controls), please do not open a public issue, see
        [SECURITY.md](../../SECURITY.md) for how to report it privately instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the exact MCP tool call (tool name and parameters) if applicable.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RedWrench version
      description: Output of `redwrench --version`, or the commit hash if built from source.
    validations:
      required: true
  - type: dropdown
    id: fedora-variant
    attributes:
      label: Fedora variant
      options:
        - Workstation (GNOME)
        - Workstation (KDE)
        - Server
        - Silverblue
        - Kinoite
        - IoT
        - Other / not Fedora
    validations:
      required: true
  - type: input
    id: tier
    attributes:
      label: Active policy tier
      description: safe, standard, or unrestricted
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant journal output
      description: Output of `journalctl -t redwrench` (or the `redwrench::audit` target) around the time of the issue, if available.
      render: shell
