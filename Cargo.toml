[package]
name = "redwrench"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A security-conscious MCP server exposing Fedora hardware and OS control to AI coding agents"
repository = "https://github.com/simonives/redwrench"

[lib]
name = "redwrench"
path = "src/lib.rs"

[[bin]]
name = "redwrench"
path = "src/main.rs"

[lints.rust]
# This crate is a privileged process spawner, so `unsafe` is denied by
# default and each exception has to be granted explicitly at its site.
# There is exactly one today: the privilege-drop `pre_exec` closure in
# `src/executor.rs`, which carries its own SAFETY note and `#[allow]`.
unsafe_code = "deny"

[dependencies]
rmcp = { version = "3.0", features = ["server", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
serde = { version = "1.0", features = ["derive"] }
schemars = "0.8"
toml = "0.8"
regex = "1"
tracing = "0.1"
tracing-journald = "0.3"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
subtle = "2"
serde_json = "1"
nix = { version = "0.31", features = ["user"] }

[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.2"

[dev-dependencies]
tempfile = "3"
