[package]
name = "redwrench"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A security-conscious MCP server exposing Fedora hardware and OS control to AI coding agents"
repository = "https://github.com/simonives/redwrench"

[lib]
name = "redwrench"
path = "src/lib.rs"

[[bin]]
name = "redwrench"
path = "src/main.rs"

[lints.rust]
# This crate is a privileged process spawner, so `unsafe` is denied by
# default and each exception has to be granted explicitly at its site.
# There is exactly one today: the privilege-drop `pre_exec` closure in
# `src/executor.rs`, which carries its own SAFETY note and `#[allow]`.
unsafe_code = "deny"

[dependencies]
rmcp = { version = "3.0", features = ["server", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
serde = { version = "1.0", features = ["derive"] }
schemars = "1.2"
toml = "1.1"
regex = "1"
tracing = "0.1"
tracing-journald = "0.3"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
subtle = "2"
serde_json = "1"
nix = { version = "0.31", features = ["user"] }

[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.3"

[dev-dependencies]
tempfile = "3"

# Read by `cargo generate-rpm` in release.yml to build a .rpm asset for
# GitHub Releases. This is not a rust2rpm-style .spec (see
# packaging/redwrench.spec's own header for why that one isn't trusted
# yet, its %cargo_build/%cargo_install macros need a real Fedora
# mock/COPR build environment this CI container doesn't provide), just a
# straightforward binary + man page + systemd unit package.
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/redwrench", dest = "/usr/bin/redwrench", mode = "0755" },
    # release.yml copies the build-hash-suffixed man page build.rs
    # generates to this stable path before this runs, the same way it
    # already does for the tarball.
    { source = "dist/redwrench.1", dest = "/usr/share/man/man1/redwrench.1", mode = "0644", doc = false },
    { source = "packaging/redwrench.service", dest = "/usr/lib/systemd/system/redwrench.service", mode = "0644" },
]
